
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vanta Sync | Official Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #080808;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #00aaff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 80px);
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #00aaff;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            max-width: 500px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background-color: #00aaff;
            color: #080808;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            VANTA <span>SYNC</span>
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="home">

        <h1>
            Welcome to <span>Vanta Sync</span>
        </h1>

        <p>
            A new vision. A new standard.
            Discover what Vanta Sync has to offer.
        </p>

        <a href="#about" class="button">
            Discover More
        </a>

    </section>

    <section class="hero" id="about">

        <h1>About <span>Us</span></h1>

        <p>
            Vanta Sync is building something different.
            Stay connected as we bring our vision to life.
        </p>

    </section>

    <footer id="contact">
        © 2026 Vanta Sync. All rights reserved.
    </footer>

</body>
</html>
